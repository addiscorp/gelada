[package]
name = "gelada"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run a program in an OS sandbox, without a container: reads everything but secrets, writes only where allowed, network on or off. macOS (Seatbelt) and Linux (Landlock + seccomp)."
license = "Apache-2.0"
repository = "https://github.com/addiscorp/gelada"
homepage = "https://gelada.dev"
keywords = ["sandbox", "security", "landlock", "seatbelt", "seccomp"]
categories = ["os", "command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "SECURITY.md"]

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
