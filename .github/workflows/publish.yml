name: Publish

# Manual: publishes Cargo.toml's version of gelada to crates.io, unless
# crates.io already has it, so rerunning is safe. Authenticates with
# crates.io trusted publishing (gelada trusts addiscorp/gelada, this file and
# the release environment); the short-lived token is revoked when the job
# ends.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal
      - name: Already on crates.io?
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'addiscorp/gelada publish workflow' "https://crates.io/api/v1/crates/gelada/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$status" = 200 ]; then
            echo "gelada $version is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.check.outputs.published != 'true'
        id: auth
      - name: Publish
        if: steps.check.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
